<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="google-site-verification" content="iImiRthOL37NE7TKjLYt1LODom7gVzNJFn4DfPmwXwI" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNDBX Sign-In</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0A0A;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .box {
    text-align: center;
    color: #fff;
  }
  #status {
    margin-top: 16px;
    font-size: 13px;
    color: #999;
  }
  #errorMsg {
    margin-top: 16px;
    font-size: 13px;
    color: #e84a4a;
    max-width: 320px;
  }
</style>
</head>
<body>
<div class="box">
  <div id="gButtonContainer"></div>
  <div id="status">Waiting for sign-in...</div>
  <div id="errorMsg"></div>
</div>

<script>
// This page's ONLY job: show Google Sign-In, get a verified token, and
// pass it back to the Apps Script window that opened it. It holds no
// secrets and does no backend work — the actual token verification
// happens server-side in Apps Script, never here.

// IMPORTANT: replace with your real OAuth Client ID (same one used in
// Cloud Console and in your Apps Script CONFIG.GOOGLE_CLIENT_ID).
var CLIENT_ID = "321070327246-230o00j46v792sofvg26vp88sj82esvn.apps.googleusercontent.com";

window.addEventListener('load', function() {
  if (typeof google === 'undefined' || !google.accounts) {
    setTimeout(arguments.callee, 200);
    return;
  }
  initSignIn();
});

function initSignIn() {
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
    setTimeout(initSignIn, 200);
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: onSignIn
  });

  google.accounts.id.renderButton(
    document.getElementById('gButtonContainer'),
    { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with' }
  );
}

function onSignIn(response) {
  document.getElementById('status').textContent = 'Signed in. Returning to app...';

  // Send the verified ID token back to whichever window opened this popup.
  if (window.opener) {
    window.opener.postMessage(
      { type: 'sndbx-auth-token', idToken: response.credential },
      '*' // the opener checks the message shape itself; this page has no secrets to protect
    );
    setTimeout(function() { window.close(); }, 400);
  } else {
    document.getElementById('errorMsg').textContent =
      'This page was opened directly rather than from the booking app. Please close this tab and use the "Sign in with Google" button inside the booking app instead.';
  }
}
</script>
</body>
</html>
